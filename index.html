<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Card Workout System</title>
  
  <!-- ========================================================================= -->
  <!-- EXTERNAL DEPENDENCIES & CDN LIBRARIES                                    -->
  <!-- ========================================================================= -->

  <!-- Tailwind CSS CDN: Provides utility-first styling classes for responsive layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 Core Library: Manages component state and virtual DOM updates -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  
  <!-- ReactDOM 18: Binds React component elements to the browser DOM root -->
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone JS Transpiler: Enables browser to compile JSX tags into JavaScript -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter (sans-serif) and JetBrains Mono (monospace font for futuristic UI look) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #060814;
      color: #f1f5f9;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-[#060814] text-slate-100 min-h-screen">

  <!-- React Mount Point: Root container element where ReactDOM injects the app -->
  <div id="root"></div>

  <!-- Fallback Screen: Displayed while external CDN scripts and Babel transpiler initialize -->
  <div id="fallback-loader" class="fixed inset-0 flex items-center justify-center bg-[#060814] text-cyan-400 font-mono text-xs font-bold tracking-widest">
    INITIALIZING MEMORY CARD SYSTEM...
  </div>

  <!-- React Application Logic inside Babel Transpiler Script Block -->
  <script type="text/babel">
    // Hide the HTML fallback loader screen as soon as Babel starts compiling React
    const loaderElem = document.getElementById('fallback-loader');
    if (loaderElem) loaderElem.style.display = 'none';

    // Extract core React state hooks into local variables
    const { useState, useEffect, useMemo } = React;

    /**
     * Helper Component: Renders SVG Path Icons dynamically based on the 'name' prop.
     * Prevents needing external SVG file assets or image URLs.
     */
    function Icon({ name, className = "w-4 h-4" }) {
      const icons = {
        book: <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z M6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5v-15A2.5 2.5 0 0 1 6.5 2Z" />,
        chart: <path d="M3 3v18h18 M18 17V9 M13 17V5 M8 17v-3" />,
        calendar: <path d="M8 2v4 M16 2v4 M3 10h18 M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />,
        download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3" />,
        dumbbell: <path d="m6.5 6.5 11 11 M21 21l-1-1 M3 3l1 1 M18 22l4-4-2.5-2.5-4 4L18 22z M2 6l4-4 2.5 2.5-4 4L2 6z M14 2l4 4-2.5 2.5-4-4L14 2z M2 18l4 4 2.5-2.5-4-4L2 18z" />,
        bookmark: <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />,
        clock: <g><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></g>,
        save: <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z M17 21v-8H7v8 M7 3v5h8" />,
        trash: <path d="M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />,
        copy: <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2 M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z" />,
        check: <polyline points="20 6 9 17 4 12" />,
        plus: <path d="M12 5v14 M5 12h14" />,
        search: <g><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></g>,
        upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12" />,
        file: <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z M14 2v6h6" />,
        arrowRight: <path d="M5 12h14 M12 5l7 7-7 7" />,
        user: <g><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></g>,
        lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>
      };

      return (
        <svg 
          className={className} 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round"
        >
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    }

    /**
     * Default Master Exercise Database:
     * Pre-populated set of exercises categorized by muscle groups.
     */
    const INITIAL_EXERCISES = [
      { id: 'ex-1', name: 'Barbell Bench Press', category: 'Chest' },
      { id: 'ex-2', name: 'Incline Dumbbell Press', category: 'Chest' },
      { id: 'ex-3', name: 'Barbell Squat', category: 'Legs' },
      { id: 'ex-4', name: 'Romanian Deadlift', category: 'Legs' },
      { id: 'ex-5', name: 'Conventional Deadlift', category: 'Back' },
      { id: 'ex-6', name: 'Lat Pulldown', category: 'Back' },
      { id: 'ex-7', name: 'Seated Cable Row', category: 'Back' },
      { id: 'ex-8', name: 'Overhead Barbell Press', category: 'Shoulders' },
      { id: 'ex-9', name: 'Dumbbell Lateral Raise', category: 'Shoulders' },
      { id: 'ex-10', name: 'Dumbbell Bicep Curl', category: 'Arms' },
      { id: 'ex-11', name: 'Tricep Rope Pushdown', category: 'Arms' },
      { id: 'ex-12', name: 'Hanging Leg Raise', category: 'Core' },
    ];

    /**
     * Default Sample Workout Entry for initial profile creation.
     */
    const SAMPLE_HISTORY = [
      {
        id: 'workout-prev-1',
        date: new Date(Date.now() - 86400000 * 2).toISOString().split('T')[0],
        title: 'Push Day - Strength',
        notes: 'Felt strong on bench today!',
        exercises: [
          {
            exerciseId: 'ex-1',
            exerciseName: 'Barbell Bench Press',
            category: 'Chest',
            unit: 'kg',
            sets: [
              { setNumber: 1, weight: 80, reps: 10, rpe: 8, completed: true },
              { setNumber: 2, weight: 85, reps: 8, rpe: 8.5, completed: true },
              { setNumber: 3, weight: 85, reps: 7, rpe: 9.5, completed: true }
            ]
          }
        ]
      }
    ];

    // Default authorized predefined users (including JPWadmin)
    const DEFAULT_AUTHORIZED_USERS = ['TSB', 'JPW', 'WRCB', 'JPWadmin'];

    /**
     * Main React Application Component:
     * Manages user authentication, workout logs, custom exercise creation,
     * routine pre-filling, performance graphing, and local storage data persistence.
     */
    function GymNotebookApp() {
      // 1. Authorized Predefined Users State
      const [authorizedUsers, setAuthorizedUsers] = useState(() => {
        const saved = localStorage.getItem('gym_notebook_authorized_users');
        return saved ? JSON.parse(saved) : DEFAULT_AUTHORIZED_USERS;
      });

      // Currently active user profile
      const [currentUser, setCurrentUser] = useState(() => {
        return localStorage.getItem('gym_notebook_current_user') || '';
      });

      // User Authentication Lock State
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return !!localStorage.getItem('gym_notebook_current_user');
      });
      const [loginInput, setLoginInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [newUserInput, setNewUserInput] = useState('');

      // Per-User Storage Keys: Isolates storage so different users cannot read each other's data
      const exercisesKey = `gym_notebook_${currentUser}_exercises`;
      const historyKey = `gym_notebook_${currentUser}_history`;
      const unitKey = `gym_notebook_${currentUser}_unit`;

      const [exercises, setExercises] = useState([]);
      const [workoutHistory, setWorkoutHistory] = useState([]);
      const [weightUnit, setWeightUnit] = useState('kg');

      // Admin Status Flag: Checks if current username is 'JPWadmin'
      const [isAdmin, setIsAdmin] = useState(false);

      useEffect(() => {
        setIsAdmin(currentUser.toLowerCase() === 'jpwadmin');
      }, [currentUser]);

      // Load user-specific profile data from browser LocalStorage whenever active user changes
      useEffect(() => {
        if (!currentUser) return;
        const savedExercises = localStorage.getItem(exercisesKey);
        const savedHistory = localStorage.getItem(historyKey);
        const savedUnit = localStorage.getItem(unitKey);

        setExercises(savedExercises ? JSON.parse(savedExercises) : INITIAL_EXERCISES);
        setWorkoutHistory(savedHistory ? JSON.parse(savedHistory) : (currentUser.toUpperCase() === 'ABS' ? SAMPLE_HISTORY : []));
        setWeightUnit(savedUnit || 'kg');

        localStorage.setItem('gym_notebook_current_user', currentUser);
      }, [currentUser, exercisesKey, historyKey, unitKey]);

      // Save authorized users list to LocalStorage
      useEffect(() => {
        localStorage.setItem('gym_notebook_authorized_users', JSON.stringify(authorizedUsers));
      }, [authorizedUsers]);

      useEffect(() => {
        if (currentUser && exercises.length > 0) {
          localStorage.setItem(exercisesKey, JSON.stringify(exercises));
        }
      }, [exercises, currentUser, exercisesKey]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem(historyKey, JSON.stringify(workoutHistory));
        }
      }, [workoutHistory, currentUser, historyKey]);

      // 2. Navigation Tab State ('today' | 'analytics' | 'history' | 'backup' | 'exercises')
      const [activeTab, setActiveTab] = useState('today');
      
      // Expand/Collapse Map for Saved Data cards
      const [expandedLogIds, setExpandedLogIds] = useState({});

      // 3. Performance Visualizer Graph Filters State
      const [selectedGraphExerciseId, setSelectedGraphExerciseId] = useState('ex-1');
      const [graphMetric, setGraphMetric] = useState('maxWeight');
      const [graphExactRep, setGraphExactRep] = useState('all');

      // 4. Current Active Session Log Input State
      const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [workoutTitle, setWorkoutTitle] = useState('Upper Body Power');
      const [workoutNotes, setWorkoutNotes] = useState('');
      const [currentExercises, setCurrentExercises] = useState([
        {
          exerciseId: 'ex-1',
          exerciseName: 'Barbell Bench Press',
          category: 'Chest',
          unit: 'kg',
          sets: [
            { id: 's1', setNumber: 1, weight: 80, reps: 8, rpe: 8, completed: true },
            { id: 's2', setNumber: 2, weight: 85, reps: 8, rpe: 8.5, completed: false },
            { id: 's3', setNumber: 3, weight: 85, reps: 6, rpe: 9, completed: false },
          ]
        }
      ]);

      // Exercise Modal & Custom Generator State
      const [isAddingExercise, setIsAddingExercise] = useState(false);
      const [exerciseSearch, setExerciseSearch] = useState('');
      const [customExName, setCustomExName] = useState('');
      const [customExCategory, setCustomExCategory] = useState('Chest');

      // Rest Timer State
      const [timerSeconds, setTimerSeconds] = useState(0);
      const [isTimerActive, setIsTimerActive] = useState(false);

      // Handle User Login Gate Form Submission (Strict Predefined Check)
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const trimmed = loginInput.trim();
        if (!trimmed) return;
        
        const matchedUser = authorizedUsers.find(
          u => u.toLowerCase() === trimmed.toLowerCase()
        );

        if (matchedUser) {
          setCurrentUser(matchedUser);
          setIsLoggedIn(true);
          setLoginInput('');
          setLoginError('');
        } else {
          setLoginError('ACCESS DENIED: USERNAME NOT AUTHORIZED BY ADMIN.');
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setCurrentUser('');
        localStorage.removeItem('gym_notebook_current_user');
      };

      // Admin Feature: JPWadmin can authorize and add new usernames
      const handleAddAuthorizedUser = (e) => {
        e.preventDefault();
        const newUser = newUserInput.trim();
        if (!newUser) return;

        if (authorizedUsers.some(u => u.toLowerCase() === newUser.toLowerCase())) {
          alert('User already exists in the authorized list.');
          return;
        }

        const updated = [...authorizedUsers, newUser];
        setAuthorizedUsers(updated);
        setNewUserInput('');
        alert(`User [${newUser}] successfully authorized!`);
      };

      // Admin Feature: Allows 'JPWadmin' to update exercise names in real time
      const handleUpdateExerciseName = (id, newName) => {
        setExercises(prev => prev.map(ex => ex.id === id ? { ...ex, name: newName } : ex));
      };

      // Memory Recall: Fetches last recorded performance of an exercise to pre-populate values
      const getLastPerformance = (exNameOrId) => {
        for (const workout of workoutHistory) {
          const found = workout.exercises.find(
            (e) => e.exerciseId === exNameOrId || e.exerciseName.toLowerCase() === exNameOrId.toLowerCase()
          );
          if (found && found.sets && found.sets.length > 0) {
            return {
              date: workout.date,
              workoutTitle: workout.title,
              sets: found.sets,
              unit: found.unit || 'kg'
            };
          }
        }
        return null;
      };

      // Routine Pre-fill Handler: Preemptively fills out a full workout session template (Push, Pull, Legs)
      const handleLoadPresetRoutine = (type) => {
        let presetExIds = [];
        let title = '';

        if (type === 'PUSH') {
          title = 'Push Day Session';
          presetExIds = ['ex-1', 'ex-2', 'ex-8', 'ex-9', 'ex-11'];
        } else if (type === 'PULL') {
          title = 'Pull Day Session';
          presetExIds = ['ex-5', 'ex-6', 'ex-7', 'ex-10'];
        } else if (type === 'LEGS') {
          title = 'Legs Day Session';
          presetExIds = ['ex-3', 'ex-4', 'ex-12'];
        }

        setWorkoutTitle(title);

        const loadedExercises = presetExIds.map(id => {
          const exObj = exercises.find(e => e.id === id) || { id, name: id, category: 'General' };
          const lastPerf = getLastPerformance(id);

          let sets = [
            { id: Date.now() + '-1', setNumber: 1, weight: 60, reps: 10, rpe: 8, completed: false },
            { id: Date.now() + '-2', setNumber: 2, weight: 60, reps: 10, rpe: 8, completed: false },
            { id: Date.now() + '-3', setNumber: 3, weight: 60, reps: 10, rpe: 8, completed: false },
          ];

          if (lastPerf && lastPerf.sets.length > 0) {
            sets = lastPerf.sets.map((s, idx) => ({
              id: Date.now() + '-' + idx,
              setNumber: idx + 1,
              weight: s.weight,
              reps: s.reps,
              rpe: s.rpe || 8,
              completed: false
            }));
          }

          return {
            exerciseId: exObj.id,
            exerciseName: exObj.name,
            category: exObj.category,
            unit: lastPerf ? lastPerf.unit : 'kg',
            sets
          };
        });

        setCurrentExercises(loadedExercises);
      };

      // Select and add exercise into active session
      const handleSelectExercise = (ex) => {
        const lastPerf = getLastPerformance(ex.id) || getLastPerformance(ex.name);
        let defaultSets = [
          { id: Date.now() + '-1', setNumber: 1, weight: 20, reps: 10, rpe: 7, completed: false },
          { id: Date.now() + '-2', setNumber: 2, weight: 20, reps: 10, rpe: 7, completed: false },
          { id: Date.now() + '-3', setNumber: 3, weight: 20, reps: 10, rpe: 8, completed: false },
        ];

        if (lastPerf && lastPerf.sets.length > 0) {
          defaultSets = lastPerf.sets.map((s, idx) => ({
            id: Date.now() + '-' + idx,
            setNumber: idx + 1,
            weight: s.weight,
            reps: s.reps,
            rpe: s.rpe || 8,
            completed: false
          }));
        }

        setCurrentExercises((prev) => [
          ...prev,
          {
            exerciseId: ex.id,
            exerciseName: ex.name,
            category: ex.category,
            unit: lastPerf ? lastPerf.unit : 'kg',
            sets: defaultSets
          }
        ]);
        setIsAddingExercise(false);
      };

      // Create new custom exercise
      const handleCreateCustomExercise = (e) => {
        e.preventDefault();
        if (!customExName.trim()) return;

        const newEx = {
          id: 'ex-custom-' + Date.now(),
          name: customExName.trim(),
          category: customExCategory
        };

        setExercises((prev) => [newEx, ...prev]);
        handleSelectExercise(newEx);
        setCustomExName('');
      };

      // Set manipulation functions
      const handleAddSet = (exIndex) => {
        setCurrentExercises((prev) => {
          const updated = [...prev];
          const targetEx = { ...updated[exIndex] };
          const lastSet = targetEx.sets[targetEx.sets.length - 1];
          const newSetNumber = targetEx.sets.length + 1;

          targetEx.sets = [
            ...targetEx.sets,
            {
              id: Date.now().toString(),
              setNumber: newSetNumber,
              weight: lastSet ? lastSet.weight : 20,
              reps: lastSet ? lastSet.reps : 10,
              rpe: lastSet ? lastSet.rpe : 8,
              completed: false
            }
          ];
          updated[exIndex] = targetEx;
          return updated;
        });
      };

      const handleUpdateSet = (exIndex, setIndex, field, value) => {
        setCurrentExercises((prev) => {
          const updated = [...prev];
          const targetEx = { ...updated[exIndex] };
          const targetSet = { ...targetEx.sets[setIndex], [field]: value };
          
          if (field === 'completed' && value === true) {
            setTimerSeconds(90);
            setIsTimerActive(true);
          }

          targetEx.sets[setIndex] = targetSet;
          updated[exIndex] = targetEx;
          return updated;
        });
      };

      const handleToggleExerciseUnit = (exIndex) => {
        setCurrentExercises((prev) => {
          const updated = [...prev];
          const targetEx = { ...updated[exIndex] };
          targetEx.unit = targetEx.unit === 'lbs' ? 'kg' : 'lbs';
          updated[exIndex] = targetEx;
          return updated;
        });
      };

      const handleRemoveExercise = (exIndex) => {
        setCurrentExercises((prev) => prev.filter((_, idx) => idx !== exIndex));
      };

      const handleSaveWorkout = () => {
        if (currentExercises.length === 0) {
          alert("Please add at least one exercise before saving your workout!");
          return;
        }

        const newLogEntry = {
          id: 'workout-' + Date.now(),
          date: selectedDate,
          title: workoutTitle || 'Gym Session',
          notes: workoutNotes,
          exercises: currentExercises
        };

        setWorkoutHistory((prev) => [newLogEntry, ...prev]);
        alert("Workout successfully saved to Saved Data!");
        setActiveTab('history');
      };

      const toggleLogExpanded = (logId) => {
        setExpandedLogIds(prev => ({ ...prev, [logId]: !prev[logId] }));
      };

      const filteredExercises = useMemo(() => {
        return exercises.filter((ex) =>
          ex.name.toLowerCase().includes(exerciseSearch.toLowerCase()) ||
          ex.category.toLowerCase().includes(exerciseSearch.toLowerCase())
        );
      }, [exercises, exerciseSearch]);

      /**
       * Performance Visualizer Data Point Calculation:
       * Filters workout history by selected exercise and exact rep count,
       * and automatically converts all recorded weights to KG (lbs * 0.453592) for standardized graphing.
       */
      const graphDataPoints = useMemo(() => {
        if (!selectedGraphExerciseId) return [];

        const currentExObj = exercises.find(e => e.id === selectedGraphExerciseId);
        const exName = currentExObj ? currentExObj.name.toLowerCase() : '';

        const sortedHistory = [...workoutHistory].sort((a, b) => new Date(a.date) - new Date(b.date));
        const points = [];

        sortedHistory.forEach((workout) => {
          const foundEx = workout.exercises.find(
            (e) => e.exerciseId === selectedGraphExerciseId || e.exerciseName.toLowerCase() === exName
          );

          if (foundEx && foundEx.sets && foundEx.sets.length > 0) {
            let validSets = foundEx.sets.filter((s) => s.completed !== false && Number(s.reps) > 0);

            if (graphExactRep !== 'all') {
              const targetRepNum = Number(graphExactRep);
              validSets = validSets.filter(s => Number(s.reps) === targetRepNum);
            }

            if (validSets.length > 0) {
              let maxWeightKg = 0;
              let maxReps = 0;
              let totalVolKg = 0;

              validSets.forEach((s) => {
                const rawW = Number(s.weight) || 0;
                const r = Number(s.reps) || 0;
                const unit = foundEx.unit || 'kg';
                const wKg = unit === 'lbs' ? rawW * 0.453592 : rawW;
                
                if (wKg > maxWeightKg) maxWeightKg = wKg;
                if (r > maxReps) maxReps = r;
                totalVolKg += wKg * r;
              });

              let val = Math.round(maxWeightKg * 10) / 10;
              if (graphMetric === 'totalVolume') val = Math.round(totalVolKg);
              if (graphMetric === 'maxReps') val = maxReps;

              points.push({
                date: workout.date,
                workoutTitle: workout.title,
                value: val,
                maxWeightKg: Math.round(maxWeightKg * 10) / 10,
                totalVolKg: Math.round(totalVolKg),
                setsCount: validSets.length
              });
            }
          }
        });

        return points;
      }, [workoutHistory, selectedGraphExerciseId, graphMetric, graphExactRep, exercises]);

      const selectedExerciseName = useMemo(() => {
        const ex = exercises.find(e => e.id === selectedGraphExerciseId);
        return ex ? ex.name : 'Exercise';
      }, [exercises, selectedGraphExerciseId]);

      const graphYMax = useMemo(() => {
        if (graphDataPoints.length === 0) return 100;
        const maxVal = Math.max(...graphDataPoints.map(p => p.value));
        return maxVal === 0 ? 100 : maxVal * 1.15;
      }, [graphDataPoints]);

      const handleExportJSON = () => {
        const backupData = {
          app: 'System Memory Logbook',
          exportDate: new Date().toISOString(),
          user: currentUser,
          workoutHistory,
          exercises,
          weightUnit
        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `memory_card_${currentUser}_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportJSON = (event) => {
        const fileReader = new FileReader();
        if (event.target.files && event.target.files[0]) {
          fileReader.readAsText(event.target.files[0], "UTF-8");
          fileReader.onload = (e) => {
            try {
              const parsed = JSON.parse(e.target.result);
              if (parsed.workoutHistory && Array.isArray(parsed.workoutHistory)) {
                setWorkoutHistory(parsed.workoutHistory);
                if (parsed.exercises) setExercises(parsed.exercises);
                if (parsed.weightUnit) setWeightUnit(parsed.weightUnit);
                alert("✅ Saved Data successfully restored!");
              } else {
                alert("❌ Invalid backup file format.");
              }
            } catch (err) {
              alert("❌ Error parsing JSON file.");
            }
          };
        }
      };

      return (
        <div className="min-h-screen bg-[#060814] text-slate-100 font-sans p-2 sm:p-4 md:p-8 flex flex-col items-center justify-start select-none relative overflow-hidden">
          
          <div className="w-full max-w-5xl bg-slate-950/90 border border-cyan-500/30 rounded-3xl shadow-[0_0_50px_rgba(6,182,212,0.15)] flex flex-col overflow-hidden backdrop-blur-xl relative z-10 min-h-[85vh]">
            
            {/* System Header Bar */}
            <div className="bg-slate-900/90 border-b border-cyan-500/30 px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_10px_#22d3ee]" />
                <span className="font-mono text-sm tracking-widest font-bold text-cyan-300 uppercase">
                  MEMORY CARD SYSTEM LOGBOOK
                </span>
              </div>

              <div className="flex items-center gap-3 text-xs font-mono">
                <div className="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-xl border border-cyan-500/40 text-cyan-300">
                  <Icon name="user" className="w-3.5 h-3.5" />
                  <span className="font-bold">{currentUser}</span>
                  {isAdmin && <span className="bg-cyan-500 text-slate-950 px-1 rounded text-[10px] font-bold">ADMIN</span>}
                </div>

                <button
                  onClick={handleLogout}
                  className="bg-slate-900 border border-cyan-500/30 hover:bg-red-950/50 hover:border-red-500/50 text-slate-400 hover:text-red-300 px-3 py-1.5 rounded-xl transition-all"
                >
                  LOGOUT
                </button>
              </div>
            </div>

            {/* Navigation Tabs Header */}
            <div className="bg-slate-900/90 text-slate-300 flex flex-wrap items-center justify-between px-3 sm:px-6 pt-3 border-b border-cyan-500/20">
              <div className="flex items-center gap-2 overflow-x-auto">
                <button
                  onClick={() => setActiveTab('today')}
                  className={`flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-t-xl text-xs sm:text-sm font-mono font-bold tracking-wider transition-all whitespace-nowrap ${
                    activeTab === 'today'
                      ? 'bg-slate-950 text-cyan-300 border-t-2 border-x border-cyan-400'
                      : 'bg-slate-900/50 text-slate-400 hover:text-cyan-200'
                  }`}
                >
                  <Icon name="book" />
                  <span>ACTIVE SESSION</span>
                </button>

                <button
                  onClick={() => setActiveTab('analytics')}
                  className={`flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-t-xl text-xs sm:text-sm font-mono font-bold tracking-wider transition-all whitespace-nowrap ${
                    activeTab === 'analytics'
                      ? 'bg-slate-950 text-cyan-300 border-t-2 border-x border-cyan-400'
                      : 'bg-slate-900/50 text-slate-400 hover:text-cyan-200'
                  }`}
                >
                  <Icon name="chart" />
                  <span>PERFORMANCE GRAPH</span>
                </button>

                <button
                  onClick={() => setActiveTab('history')}
                  className={`flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-t-xl text-xs sm:text-sm font-mono font-bold tracking-wider transition-all whitespace-nowrap ${
                    activeTab === 'history'
                      ? 'bg-slate-950 text-cyan-300 border-t-2 border-x border-cyan-400'
                      : 'bg-slate-900/50 text-slate-400 hover:text-cyan-200'
                  }`}
                >
                  <Icon name="calendar" />
                  <span>SAVED DATA</span>
                  <span className="bg-cyan-950 border border-cyan-500/40 text-cyan-300 text-xs px-2 py-0.5 rounded-full">
                    {workoutHistory.length}
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab('backup')}
                  className={`flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-t-xl text-xs sm:text-sm font-mono font-bold tracking-wider transition-all whitespace-nowrap ${
                    activeTab === 'backup'
                      ? 'bg-slate-950 text-cyan-300 border-t-2 border-x border-cyan-400'
                      : 'bg-slate-900/50 text-slate-400 hover:text-cyan-200'
                  }`}
                >
                  <Icon name="download" />
                  <span>BACKUP / TRANSFER</span>
                </button>

                <button
                  onClick={() => setActiveTab('exercises')}
                  className={`flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-t-xl text-xs sm:text-sm font-mono font-bold tracking-wider transition-all whitespace-nowrap ${
                    activeTab === 'exercises'
                      ? 'bg-slate-950 text-cyan-300 border-t-2 border-x border-cyan-400'
                      : 'bg-slate-900/50 text-slate-400 hover:text-cyan-200'
                  }`}
                >
                  <Icon name="dumbbell" />
                  <span>DATABASE</span>
                </button>
              </div>
            </div>

            {/* Main Application Body Sheet */}
            <div className="flex-1 p-4 sm:p-8 relative overflow-y-auto">

              {/* TAB 1: ACTIVE WORKOUT SESSION LOGGING */}
              {activeTab === 'today' && (
                <div className="max-w-4xl mx-auto space-y-6">
                  
                  {/* Pre-filled Routines Toolbar */}
                  <div className="bg-slate-900/90 border border-cyan-500/30 p-3 rounded-xl flex items-center justify-between gap-2 flex-wrap">
                    <span className="text-xs font-mono font-bold text-cyan-400 uppercase">QUICK PRE-FILL ROUTINE:</span>
                    <div className="flex gap-2">
                      <button
                        onClick={() => handleLoadPresetRoutine('PUSH')}
                        className="px-3 py-1 bg-cyan-950 hover:bg-cyan-900 text-cyan-300 border border-cyan-500/40 text-xs font-mono rounded-lg font-bold"
                      >
                        + PUSH DAY
                      </button>
                      <button
                        onClick={() => handleLoadPresetRoutine('PULL')}
                        className="px-3 py-1 bg-cyan-950 hover:bg-cyan-900 text-cyan-300 border border-cyan-500/40 text-xs font-mono rounded-lg font-bold"
                      >
                        + PULL DAY
                      </button>
                      <button
                        onClick={() => handleLoadPresetRoutine('LEGS')}
                        className="px-3 py-1 bg-cyan-950 hover:bg-cyan-900 text-cyan-300 border border-cyan-500/40 text-xs font-mono rounded-lg font-bold"
                      >
                        + LEGS DAY
                      </button>
                    </div>
                  </div>

                  {/* Header Workout Title and Date */}
                  <div className="border-b border-cyan-500/20 pb-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div className="flex-1">
                      <input
                        type="text"
                        value={workoutTitle}
                        onChange={(e) => setWorkoutTitle(e.target.value)}
                        placeholder="Session Title..."
                        className="w-full bg-transparent text-2xl sm:text-3xl font-bold text-white border-b border-cyan-500/30 focus:border-cyan-400 outline-none pb-1 font-sans"
                      />
                    </div>

                    <div className="flex items-center gap-3">
                      <input
                        type="date"
                        value={selectedDate}
                        onChange={(e) => setSelectedDate(e.target.value)}
                        className="bg-slate-900 border border-cyan-500/40 rounded-lg px-3 py-1.5 text-sm font-mono text-cyan-200 outline-none"
                      />

                      <button
                        onClick={handleSaveWorkout}
                        className="flex items-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold px-5 py-2.5 rounded-xl shadow-lg text-sm"
                      >
                        <Icon name="save" />
                        <span>SAVE WORKOUT</span>
                      </button>
                    </div>
                  </div>

                  {/* Logged Exercise Cards */}
                  <div className="space-y-6">
                    {currentExercises.map((ex, exIdx) => (
                      <div key={exIdx} className="bg-slate-900/80 border border-cyan-500/30 rounded-2xl p-5 space-y-4">
                        <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                          <div className="flex items-center gap-3">
                            <span className="font-bold text-white text-lg">{ex.exerciseName}</span>
                            <button
                              onClick={() => handleToggleExerciseUnit(exIdx)}
                              className="px-2 py-0.5 bg-slate-950 border border-cyan-500/40 text-cyan-300 text-xs font-mono rounded font-bold"
                            >
                              UNIT: {ex.unit || 'kg'}
                            </button>
                          </div>
                          <button onClick={() => handleRemoveExercise(exIdx)} className="text-slate-500 hover:text-red-400">
                            <Icon name="trash" />
                          </button>
                        </div>

                        <div className="space-y-2">
                          {ex.sets.map((set, setIdx) => (
                            <div key={setIdx} className="grid grid-cols-12 gap-2 items-center bg-slate-950 p-2 rounded-xl border border-slate-800">
                              <span className="col-span-2 text-center font-mono text-xs text-cyan-300">Set #{set.setNumber}</span>
                              <input
                                type="number"
                                value={set.weight}
                                onChange={(e) => handleUpdateSet(exIdx, setIdx, 'weight', e.target.value)}
                                className="col-span-3 bg-slate-900 border border-cyan-500/30 rounded px-2 py-1 text-sm font-mono text-center text-white"
                              />
                              <input
                                type="number"
                                value={set.reps}
                                onChange={(e) => handleUpdateSet(exIdx, setIdx, 'reps', e.target.value)}
                                className="col-span-3 bg-slate-900 border border-cyan-500/30 rounded px-2 py-1 text-sm font-mono text-center text-white"
                              />
                              <button
                                onClick={() => handleUpdateSet(exIdx, setIdx, 'completed', !set.completed)}
                                className={`col-span-4 py-1 rounded font-mono text-xs font-bold ${set.completed ? 'bg-cyan-500 text-slate-950' : 'bg-slate-900 text-slate-400'}`}
                              >
                                {set.completed ? 'DONE' : 'LOG'}
                              </button>
                            </div>
                          ))}
                        </div>

                        <button
                          onClick={() => handleAddSet(exIdx)}
                          className="w-full py-2 bg-slate-950 border border-dashed border-cyan-500/30 text-cyan-300 rounded-xl font-mono text-xs font-bold"
                        >
                          + ADD SET
                        </button>
                      </div>
                    ))}
                  </div>

                  <button
                    onClick={() => setIsAddingExercise(true)}
                    className="w-full py-4 bg-cyan-950/40 border-2 border-dashed border-cyan-500/50 text-cyan-300 rounded-2xl font-mono font-bold text-sm"
                  >
                    SELECT MOVEMENT TO LOG
                  </button>

                </div>
              )}

              {/* TAB 2: PERFORMANCE GRAPH VISUALIZER */}
              {activeTab === 'analytics' && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <div className="bg-slate-900/80 p-4 rounded-xl border border-cyan-500/30 flex flex-wrap justify-between items-center gap-4">
                    <div className="flex items-center gap-2">
                      <label className="text-xs font-mono text-cyan-400 font-bold uppercase">MOVEMENT:</label>
                      <select
                        value={selectedGraphExerciseId}
                        onChange={(e) => setSelectedGraphExerciseId(e.target.value)}
                        className="bg-slate-950 border border-cyan-500/40 rounded-xl px-3 py-2 text-sm font-mono text-cyan-200 outline-none"
                      >
                        {exercises.map((ex) => (
                          <option key={ex.id} value={ex.id}>{ex.name}</option>
                        ))}
                      </select>
                    </div>

                    <div className="flex items-center gap-2">
                      <label className="text-xs font-mono text-cyan-400 font-bold uppercase">EXACT REPS:</label>
                      <select
                        value={graphExactRep}
                        onChange={(e) => setGraphExactRep(e.target.value)}
                        className="bg-slate-950 border border-cyan-500/40 rounded-xl px-3 py-2 text-sm font-mono text-cyan-200 outline-none"
                      >
                        <option value="all">ALL REPS</option>
                        {Array.from({ length: 15 }, (_, i) => (
                          <option key={i + 1} value={i + 1}>{i + 1} REP{i > 0 ? 'S' : ''}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* SVG Line Graph Container */}
                  <div className="bg-slate-950 border border-cyan-500/40 rounded-2xl p-6 relative">
                    <div className="text-xs font-mono text-cyan-400 font-bold mb-4 uppercase">
                      {selectedExerciseName} {graphExactRep !== 'all' ? `(${graphExactRep} Reps)` : ''} (CONVERTED TO KG)
                    </div>

                    <div className="w-full h-72 relative">
                      <svg className="w-full h-full overflow-visible" viewBox="0 0 500 200" preserveAspectRatio="none">
                        {/* Render horizontal graph grid lines */}
                        {[0, 0.25, 0.5, 0.75, 1].map((pct, idx) => (
                          <line key={idx} x1="30" y1={20 + pct * 140} x2="480" y2={20 + pct * 140} stroke="#1e293b" strokeDasharray="4 4" />
                        ))}
                        {/* Render data points and vertically rotated date labels */}
                        {graphDataPoints.map((p, i) => {
                          const x = graphDataPoints.length === 1 ? 255 : 30 + (i / (graphDataPoints.length - 1)) * 450;
                          const y = 160 - (p.value / graphYMax) * 140;

                          return (
                            <g key={i}>
                              <circle cx={x} cy={y} r="6" fill="#22d3ee" />
                              <text x={x} y="195" textAnchor="end" transform={`rotate(-90 ${x} 195)`} className="fill-cyan-400 font-mono text-[9px]">
                                {p.date}
                              </text>
                            </g>
                          );
                        })}
                      </svg>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 3: SAVED DATA ARCHIVE LOGS */}
              {activeTab === 'history' && (
                <div className="max-w-4xl mx-auto space-y-4">
                  {workoutHistory.map((entry) => (
                    <div key={entry.id} className="bg-slate-900/80 border border-cyan-500/30 rounded-2xl p-4">
                      <div onClick={() => toggleLogExpanded(entry.id)} className="cursor-pointer flex justify-between items-center">
                        <div className="flex items-center gap-3">
                          <span className="text-lg font-bold font-mono text-cyan-300">{entry.date}</span>
                          <span className="text-white font-bold">{entry.title}</span>
                        </div>
                        <span className="text-xs text-cyan-400 font-mono">{expandedLogIds[entry.id] ? 'COLLAPSE ▲' : 'EXPAND ▼'}</span>
                      </div>

                      {expandedLogIds[entry.id] && (
                        <div className="mt-4 space-y-3 pt-3 border-t border-slate-800">
                          {entry.exercises.map((ex, exIdx) => (
                            <div key={exIdx} className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs font-mono">
                              <div className="font-bold text-cyan-300">{ex.exerciseName} ({ex.unit || 'kg'})</div>
                              <div className="flex flex-wrap gap-2 mt-1">
                                {ex.sets.map((s, sIdx) => (
                                  <span key={sIdx} className="bg-slate-900 px-2 py-0.5 rounded border border-slate-800">
                                    Set {s.setNumber}: {s.weight}{ex.unit || 'kg'} × {s.reps}
                                  </span>
                                ))}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}

              {/* TAB 4: BACKUP & RESTORE */}
              {activeTab === 'backup' && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <button onClick={handleExportJSON} className="w-full py-3 bg-cyan-500 text-slate-950 font-mono font-bold rounded-xl">
                    DOWNLOAD JSON BACKUP
                  </button>
                  <label className="block w-full py-3 text-center border-2 border-dashed border-cyan-500/40 bg-slate-950 text-cyan-300 rounded-xl font-mono font-bold cursor-pointer">
                    RESTORE JSON FILE
                    <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                  </label>
                </div>
              )}

              {/* TAB 5: DATABASE & ADMIN CONTROLS */}
              {activeTab === 'exercises' && (
                <div className="max-w-4xl mx-auto space-y-6">
                  
                  {/* Admin User Management Panel (Visible only to JPWadmin) */}
                  {isAdmin && (
                    <div className="bg-slate-900 border-2 border-cyan-500/50 rounded-2xl p-5 space-y-4 shadow-xl">
                      <div className="border-b border-cyan-500/30 pb-2">
                        <h3 className="text-sm font-mono font-bold text-cyan-400 uppercase tracking-widest">
                          👑 ADMIN CONTROL: AUTHORIZE NEW USERS
                        </h3>
                        <p className="text-xs text-slate-400 mt-1">
                          Only predefined authorized users can log into the system. Add new usernames below.
                        </p>
                      </div>

                      <form onSubmit={handleAddAuthorizedUser} className="flex gap-2">
                        <input
                          type="text"
                          placeholder="New username..."
                          value={newUserInput}
                          onChange={(e) => setNewUserInput(e.target.value)}
                          className="flex-1 bg-slate-950 border border-cyan-500/40 rounded-xl px-3 py-2 text-sm font-mono text-cyan-200 outline-none uppercase"
                        />
                        <button
                          type="submit"
                          className="px-5 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-mono font-bold text-xs rounded-xl uppercase"
                        >
                          AUTHORIZE USER
                        </button>
                      </form>

                      <div>
                        <span className="text-[11px] font-mono text-slate-400 uppercase block mb-2">Authorized Users List:</span>
                        <div className="flex flex-wrap gap-2">
                          {authorizedUsers.map(u => (
                            <span key={u} className="bg-slate-950 border border-cyan-500/30 text-cyan-300 text-xs font-mono px-3 py-1 rounded-lg font-bold">
                              {u} {u === 'JPWadmin' ? '(ADMIN)' : ''}
                            </span>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  <div className="border-b border-cyan-500/20 pb-3 flex justify-between items-center">
                    <div>
                      <h2 className="text-2xl font-bold font-mono text-white">EXERCISE DATABASE</h2>
                      {isAdmin && (
                        <p className="text-xs font-mono text-cyan-400 font-bold mt-1">
                          👑 ADMIN MODE: YOU CAN EDIT EXERCISE NAMES BELOW
                        </p>
                      )}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {exercises.map((ex) => (
                      <div key={ex.id} className="bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex justify-between items-center gap-2">
                        {isAdmin ? (
                          <input
                            type="text"
                            value={ex.name}
                            onChange={(e) => handleUpdateExerciseName(ex.id, e.target.value)}
                            className="bg-slate-950 border border-cyan-500/50 rounded px-2 py-1 text-sm font-bold text-white outline-none focus:border-cyan-400 flex-1 font-sans"
                          />
                        ) : (
                          <span className="font-bold text-white text-base">{ex.name}</span>
                        )}
                        <span className="text-xs font-mono bg-cyan-950 border border-cyan-500/40 text-cyan-300 px-2 py-0.5 rounded whitespace-nowrap">
                          {ex.category}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </div>

            {/* Footer Bar */}
            <div className="bg-slate-950 border-t border-cyan-500/20 py-2.5 px-6 flex justify-between items-center text-[11px] font-mono text-cyan-400/60">
              <span>MEMORY CARD SLOT 1 ACTIVE • USER: {currentUser} {isAdmin ? '(ADMIN)' : ''}</span>
              <span className="hidden sm:inline">AUTOSAVED TO LOCAL STORAGE</span>
            </div>
          </div>

          {/* USER LOGIN AUTHENTICATION GATE (STRICT AUTHORIZED CHECK) */}
          {!isLoggedIn && (
            <div className="fixed inset-0 bg-[#060814] z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-slate-950 border border-cyan-500/40 rounded-3xl p-6 sm:p-8 shadow-[0_0_60px_rgba(6,182,212,0.25)] space-y-6">
                <div className="text-center space-y-2">
                  <div className="w-12 h-12 rounded-2xl bg-cyan-950 border border-cyan-400 text-cyan-300 flex items-center justify-center mx-auto shadow-[0_0_20px_#22d3ee]">
                    <Icon name="user" className="w-6 h-6" />
                  </div>
                  <h2 className="text-xl font-mono font-bold text-white tracking-widest uppercase">
                    MEMORY CARD ACCESS LOCK
                  </h2>
                  <p className="text-xs font-mono text-cyan-400/70">
                    Enter your authorized username to unlock your profile.
                  </p>
                </div>

                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  <div>
                    <label className="block text-[10px] font-mono uppercase text-cyan-400 font-bold mb-1.5">
                      USERNAME:
                    </label>
                    <input
                      type="text"
                      placeholder="Type username..."
                      value={loginInput}
                      onChange={(e) => {
                        setLoginInput(e.target.value);
                        setLoginError('');
                      }}
                      className="w-full bg-slate-900 border border-cyan-500/40 rounded-xl px-4 py-3 text-sm font-mono text-cyan-200 outline-none focus:border-cyan-400 shadow-inner uppercase"
                      autoFocus
                    />
                  </div>

                  {loginError && (
                    <div className="bg-red-950/80 border border-red-500/50 p-2.5 rounded-xl text-red-300 text-xs font-mono font-bold text-center">
                      {loginError}
                    </div>
                  )}

                  <button
                    type="submit"
                    className="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-mono font-bold text-sm rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all uppercase"
                  >
                    ACCESS USER PROFILE
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* EXERCISE SELECTION MODAL DRAWER */}
          {isAddingExercise && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
                <div className="bg-slate-950 text-cyan-300 p-4 flex items-center justify-between border-b border-cyan-500/30">
                  <h3 className="font-mono font-bold text-base">SELECT MOVEMENT</h3>
                  <button onClick={() => setIsAddingExercise(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-4 space-y-4 overflow-y-auto flex-1">
                  <input
                    type="text"
                    placeholder="Search exercises..."
                    value={exerciseSearch}
                    onChange={(e) => setExerciseSearch(e.target.value)}
                    className="w-full py-2 px-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 outline-none"
                  />

                  <form onSubmit={handleCreateCustomExercise} className="flex gap-2 bg-cyan-950/30 p-3 rounded-xl border border-cyan-500/30">
                    <input
                      type="text"
                      placeholder="Custom exercise name..."
                      value={customExName}
                      onChange={(e) => setCustomExName(e.target.value)}
                      className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white outline-none"
                    />
                    <button type="submit" className="bg-cyan-500 text-slate-950 font-mono font-bold text-xs px-3 py-1.5 rounded-lg">
                      ADD
                    </button>
                  </form>

                  <div className="space-y-2">
                    {filteredExercises.map(ex => (
                      <button
                        key={ex.id}
                        onClick={() => handleSelectExercise(ex)}
                        className="w-full text-left p-3 bg-slate-950 hover:bg-cyan-950/40 rounded-xl border border-slate-800 text-white font-bold text-sm flex justify-between"
                      >
                        <span>{ex.name}</span>
                        <span className="text-xs font-mono text-cyan-300 bg-slate-900 px-2 py-0.5 rounded">{ex.category}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount the React Application Component into the HTML DOM root node
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GymNotebookApp />);
  </script>
</body>
</html>
